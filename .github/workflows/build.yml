name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle 8.0
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'
        cache-read-only: true
        cache-write-only: false

    - name: Prepare Project and Gradle Wrapper
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        # Crear recursos faltantes para evitar errores en el manifest
        mkdir -p app/src/main/res/mipmap-hdpi
        touch app/src/main/res/mipmap-hdpi/ic_launcher.png
        touch app/src/main/res/mipmap-hdpi/ic_launcher_round.png

        # Crear el archivo gradlew físicamente en la raíz para satisfacer cualquier comando heredado
        gradle wrapper --gradle-version 8.0

        # Inyectar compatibilidad con Java 17 en el build.gradle si hace falta
        BUILD_GRADLE="app/build.gradle"
        if [ -f "$BUILD_GRADLE" ]; then
          if ! grep -q "compileOptions" "$BUILD_GRADLE"; then
            sed -i '/android {/a \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }' "$BUILD_GRADLE"
          fi
        fi

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
